<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img">
  <rect width="1120" height="610" fill="#ffffff"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #596579; }
    .axis { stroke: #172033; stroke-width: 1.4; }
    .grid { stroke: #D8E0EA; stroke-width: 1; }
    .tick { font-size: 13px; fill: #596579; }
    .label { font-size: 15px; font-weight: 700; }
    .small { font-size: 12px; fill: #596579; }
    .legend { font-size: 14px; }
    .panel { font-size: 16px; font-weight: 700; }
  </style>
<text x="54" y="48" class="title">Ablation table linking modules to evidence</text>
