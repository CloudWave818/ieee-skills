<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img">
  <rect width="980" height="620" fill="#ffffff"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #596579; }
    .axis { stroke: #172033; stroke-width: 1.4; }
    .grid { stroke: #D8E0EA; stroke-width: 1; }
    .tick { font-size: 13px; fill: #596579; }
    .label { font-size: 15px; font-weight: 700; }
    .small { font-size: 12px; fill: #596579; }
    .legend { font-size: 14px; }
    .panel { font-size: 16px; font-weight: 700; }
  </style>
<text x="54" y="48" class="title">Accuracy-latency Pareto evidence for deployment</text>
<text x="54" y="76" class="subtitle">Upper-left is better: higher F1 with lower inference latency.</text>
<line x1="110" y1="510" x2="870" y2="510" class="axis"/>
<line x1="110" y1="112" x2="110" y2="510" class="axis"/>
<line x1="110.0" y1="112" x2="110.0" y2="510" class="grid"/>
<text x="110.0" y="535" text-anchor="middle" class="tick">0</text>
<line x1="268.3" y1="112" x2="268.3" y2="510" class="grid"/>
<text x="268.3" y="535" text-anchor="middle" class="tick">10</text>
<line x1="426.7" y1="112" x2="426.7" y2="510" class="grid"/>
<text x="426.7" y="535" text-anchor="middle" class="tick">20</text>
<line x1="585.0" y1="112" x2="585.0" y2="510" class="grid"/>
<text x="585.0" y="535" text-anchor="middle" class="tick">30</text>
<line x1="743.3" y1="112" x2="743.3" y2="510" class="grid"/>
<text x="743.3" y="535" text-anchor="middle" class="tick">40</text>
<line x1="110" y1="460.2" x2="870" y2="460.2" class="grid"/>
<text x="98" y="464.2" text-anchor="end" class="tick">0.80</text>
<line x1="110" y1="360.8" x2="870" y2="360.8" class="grid"/>
<text x="98" y="364.8" text-anchor="end" class="tick">0.84</text>
<line x1="110" y1="261.2" x2="870" y2="261.2" class="grid"/>
<text x="98" y="265.2" text-anchor="end" class="tick">0.88</text>
<line x1="110" y1="161.7" x2="870" y2="161.7" class="grid"/>
<text x="98" y="165.7" text-anchor="end" class="tick">0.92</text>
<polyline points="195.5,430.4 249.3,281.1 323.8,154.3" fill="none" stroke="#0B5CAD" stroke-width="3" stroke-dasharray="7,5"/>
<circle cx="195.5" cy="430.4" r="8.1" fill="#A8B3C2" fill-opacity="0.82" stroke="#697789" stroke-width="1.4"/>
<text x="205.5" y="418.4" class="legend">TinyCNN</text>
<circle cx="249.3" cy="281.1" r="9.4" fill="#A8B3C2" fill-opacity="0.82" stroke="#697789" stroke-width="1.4"/>
<text x="259.3" y="269.1" class="legend">MobileNet</text>
<circle cx="442.5" cy="316.0" r="12.9" fill="#A8B3C2" fill-opacity="0.82" stroke="#697789" stroke-width="1.4"/>
<text x="452.5" y="304.0" class="legend">LSTM</text>
<circle cx="600.8" cy="199.1" r="18.9" fill="#A8B3C2" fill-opacity="0.82" stroke="#697789" stroke-width="1.4"/>
<text x="610.8" y="187.1" class="legend">ResNet</text>
<circle cx="790.8" cy="166.7" r="25.0" fill="#A8B3C2" fill-opacity="0.82" stroke="#697789" stroke-width="1.4"/>
<text x="800.8" y="154.7" class="legend">Transformer</text>
<circle cx="323.8" cy="154.3" r="11.6" fill="#0B5CAD" fill-opacity="0.82" stroke="#172033" stroke-width="1.4"/>
<text x="333.8" y="138.3" class="legend" font-weight="700">Ours</text>
<text x="490.0" y="576" text-anchor="middle" class="label">Inference latency (ms, lower is better)</text>
<text x="28" y="311.0" transform="rotate(-90 28 311.0)" text-anchor="middle" class="label">F1 score (higher is better)</text>
<text x="870" y="88" text-anchor="end" class="small">Circle size encodes parameter count. Dashed line marks the Pareto frontier.</text>
</svg>
