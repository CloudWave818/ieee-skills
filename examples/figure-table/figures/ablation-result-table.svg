<text x="914.0" y="482" text-anchor="middle" font-size="15" font-weight="700" fill="#172033">13.2</text>
<text x="64" y="548" class="small">Claim: attention, temporal modeling, physics guidance, and augmentation each improve predictive evidence; latency remains within the deployment budget.</text>
<text x="64" y="573" class="small">Missing in real manuscripts: repeat definition, variance or confidence interval, statistical test if wins are claimed as significant.</text>
