<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-label="Accuracy-latency tradeoff for deployment">
  <rect width="1120" height="650" fill="#ffffff"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
    .title { font-size: 25px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #6B7280; }
    .axis { stroke: #172033; stroke-width: 1.35; }
    .grid { stroke: #D7DEE8; stroke-width: 1; }
    .tick { font-size: 12.5px; fill: #6B7280; }
    .label { font-size: 14.5px; font-weight: 700; }
    .small { font-size: 12px; fill: #6B7280; }
    .legend { font-size: 13.5px; fill: #172033; }
    .note { font-size: 12px; fill: #6B7280; }
    .panel { font-size: 16px; font-weight: 700; }
    .method { font-size: 13px; font-weight: 700; }
  </style>
  <text x="54" y="46" class="title">Accuracy-latency tradeoff for deployment</text>
  <text x="54" y="72" class="subtitle">Synthetic demo. Upper-left evidence supports a bounded deployment claim rather than accuracy-only reporting.</text>
  <rect x="112" y="122" width="828" height="410" fill="#ffffff" stroke="#DCE3EC"/>
  <rect x="112" y="122" width="331.2" height="172.2" fill="#D9ECFF" opacity="0.36"/>
  <text x="134" y="150" class="note">preferred region: high F1 + low latency</text>
  <line x1="112.0" y1="122" x2="112.0" y2="532" class="grid"/>
  <text x="112.0" y="557" text-anchor="middle" class="tick">0</text>
  <line x1="284.5" y1="122" x2="284.5" y2="532" class="grid"/>
  <text x="284.5" y="557" text-anchor="middle" class="tick">10</text>
  <line x1="457.0" y1="122" x2="457.0" y2="532" class="grid"/>
  <text x="457.0" y="557" text-anchor="middle" class="tick">20</text>
  <line x1="629.5" y1="122" x2="629.5" y2="532" class="grid"/>
  <text x="629.5" y="557" text-anchor="middle" class="tick">30</text>
  <line x1="802.0" y1="122" x2="802.0" y2="532" class="grid"/>
  <text x="802.0" y="557" text-anchor="middle" class="tick">40</text>
  <line x1="112" y1="480.7" x2="940" y2="480.7" class="grid"/>
  <text x="100" y="484.7" text-anchor="end" class="tick">0.80</text>
  <line x1="112" y1="378.3" x2="940" y2="378.3" class="grid"/>
  <text x="100" y="382.3" text-anchor="end" class="tick">0.84</text>
  <line x1="112" y1="275.7" x2="940" y2="275.7" class="grid"/>
  <text x="100" y="279.7" text-anchor="end" class="tick">0.88</text>
  <line x1="112" y1="173.2" x2="940" y2="173.2" class="grid"/>
  <text x="100" y="177.2" text-anchor="end" class="tick">0.92</text>
  <line x1="112" y1="532" x2="940" y2="532" class="axis"/>
  <line x1="112" y1="122" x2="112" y2="532" class="axis"/>
  <polyline points="205.2,450.0 263.8,296.2 344.9,165.6" fill="none" stroke="#0B5CAD" stroke-width="2.2" stroke-dasharray="8,5" opacity="0.9"/>
  <circle cx="205.2" cy="450.0" r="8.1" fill="#FFFFFF" fill-opacity="0.72" stroke="#B64040" stroke-width="2"/>
  <text x="214.2" y="470.0" class="legend" font-weight="400">TinyCNN</text>
  <circle cx="263.8" cy="296.2" r="9.0" fill="#0F766E" fill-opacity="0.72" stroke="#0F766E" stroke-width="2"/>
  <text x="273.8" y="283.2" class="legend" font-weight="400">MobileNet</text>
  <circle cx="474.2" cy="332.1" r="11.1" fill="#FFFFFF" fill-opacity="0.72" stroke="#B64040" stroke-width="2"/>
  <text x="484.2" y="354.1" class="legend" font-weight="400">LSTM</text>
  <circle cx="646.8" cy="211.7" r="14.8" fill="#0F766E" fill-opacity="0.72" stroke="#0F766E" stroke-width="2"/>
  <text x="656.8" y="201.7" class="legend" font-weight="400">ResNet</text>
  <circle cx="853.8" cy="178.4" r="18.6" fill="#0F766E" fill-opacity="0.72" stroke="#0F766E" stroke-width="2"/>
  <text x="731.8" y="165.4" class="legend" font-weight="400">Transformer</text>
  <circle cx="344.9" cy="165.6" r="10.3" fill="#0B5CAD" fill-opacity="0.95" stroke="#0B5CAD" stroke-width="2"/>
  <text x="356.9" y="147.6" class="legend" font-weight="700">Ours</text>
  <rect x="973" y="158" width="104" height="242" rx="8" fill="#F7FAFD" stroke="#DCE3EC"/>
  <text x="991" y="192" class="method">Encoding</text>
  <circle cx="997" cy="224" r="8" fill="#0B5CAD" stroke="#0B5CAD" stroke-width="2"/>
  <text x="1015" y="228" class="legend">proposed</text>
  <circle cx="997" cy="260" r="8" fill="#0F766E" fill-opacity="0.72" stroke="#0F766E" stroke-width="2"/>
  <text x="1015" y="264" class="legend">recent</text>
  <circle cx="997" cy="296" r="8" fill="#fff" stroke="#B64040" stroke-width="2"/>
  <text x="1015" y="300" class="legend">classical</text>
  <line x1="991" y1="328" x2="1059" y2="328" stroke="#DCE3EC"/>
  <text x="991" y="356" class="small">bubble size</text>
  <text x="991" y="376" class="small">= parameters</text>
  <text x="526.0" y="605" text-anchor="middle" class="label">Inference latency (ms; lower is better)</text>
  <text x="30" y="327.0" transform="rotate(-90 30 327.0)" text-anchor="middle" class="label">Macro-F1 (higher is better)</text>
  <text x="940" y="630" text-anchor="end" class="small">IEEE QA: accuracy and deployment cost are visible in the same evidence panel.</text>
</svg>
