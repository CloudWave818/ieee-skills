name: ieee-experiment
version: 0.2.0
description: >
  Declarative router for IEEE experiment design and audit. SKILL.md loads
  task-specific, evidence-specific, failure-mode, and workflow fragments.

always_load:
  - ../_shared/references/ieee-official-source-basis.md
  - ../_shared/references/ieee-engineering-logic.md
  - ../_shared/references/ieee-experiment-checklist.md
  - static/core/stance.md
  - static/core/workflow.md
  - static/core/claim-evidence-matrix.md
  - static/core/output-format.md

axes:
  task_type:
    detect: |
      Detect the technical task being validated. Use general when uncertain.
    values:
      classification: static/fragments/task_type/classification.md
      detection: static/fragments/task_type/detection.md
      regression: static/fragments/task_type/regression.md
      control: static/fragments/task_type/control.md
      signal-processing: static/fragments/task_type/signal-processing.md
      communications: static/fragments/task_type/communications.md
      optimization: static/fragments/task_type/optimization.md
      hardware-system: static/fragments/task_type/hardware-system.md
      general: static/fragments/task_type/general.md
    default: general
    multi: false

  evidence_type:
    detect: |
      Detect which evidence category the user needs. Multiple categories may
      apply when auditing a full experiment section.
    values:
      baseline: static/fragments/evidence_type/baseline.md
      ablation: static/fragments/evidence_type/ablation.md
      robustness: static/fragments/evidence_type/robustness.md
      complexity: static/fragments/evidence_type/complexity.md
      statistical: static/fragments/evidence_type/statistical.md
      real-world: static/fragments/evidence_type/real-world.md
      reproducibility: static/fragments/evidence_type/reproducibility.md
    multi: true

  failure_mode:
    detect: |
      Detect review risks in the current experiment design or result text.
      Multiple values may apply.
    values:
      missing-traditional-baseline: static/fragments/failure_mode/missing-traditional-baseline.md
      unfair-comparison: static/fragments/failure_mode/unfair-comparison.md
      weak-ablation: static/fragments/failure_mode/weak-ablation.md
      no-condition-test: static/fragments/failure_mode/no-condition-test.md
      overclaimed-results: static/fragments/failure_mode/overclaimed-results.md
      insufficient-reproducibility: static/fragments/failure_mode/insufficient-reproducibility.md
    multi: true

  stage:
    detect: |
      Detect whether the user is planning experiments, auditing current
      experiments, writing results, or preparing reviewer responses.
    values:
      planning: static/fragments/stage/planning.md
      audit: static/fragments/stage/audit.md
      result-writing: static/fragments/stage/result-writing.md
      reviewer-response: static/fragments/stage/reviewer-response.md
    default: audit
    multi: false

references:
  on_demand:
    - condition: figure/table presentation of experimental results
      path: ../_shared/references/ieee-figure-table-standards.md
    - condition: reviewer severity or decision risk
      path: ../_shared/references/ieee-reviewer-criteria.md
    - condition: manuscript section structure
      path: ../_shared/references/ieee-paper-structure.md
